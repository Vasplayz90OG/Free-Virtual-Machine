name: Ultimate Multi-Link VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  Build-VPS:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo (For Auto-Backup)
        uses: actions/checkout@v4

      - name: Setup Main VPS & Generate 5 Links
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate docker.io
          
          echo "====================================="
          echo "GENERATING 5 TMATE SSH LINKS..."
          echo "====================================="
          
          # Generate 5 separate sockets so if one crashes, you use the next
          for i in {1..5}; do
            SOCK="/tmp/tmate_${i}.sock"
            tmate -S $SOCK new-session -d
            tmate -S $SOCK wait tmate-ready
            LINK=$(tmate -S $SOCK display -p '#{tmate_ssh}')
            echo "Main VPS Link #$i: $LINK"
          done
          
          echo "====================================="
          echo "ALL LINKS GENERATED. VPS IS ONLINE."
          echo "Type ./newvps.sh to create an isolated external VPS!"
          echo "====================================="

      - name: Create 'newvps.sh' Command
        run: |
          cat > newvps.sh << 'EOF'
          #!/bin/bash
          NAME="ext-vps-$(date +%s)"
          echo "[*] Creating a brand new isolated External VPS..."
          sudo docker run -d --name $NAME --privileged ubuntu:22.04 sleep infinity > /dev/null
          sudo docker exec $NAME bash -c "apt-get update > /dev/null 2>&1 && apt-get install -y tmate > /dev/null 2>&1"
          sudo docker exec -d $NAME tmate -S /tmp/tmate.sock new-session -d
          sudo docker exec $NAME tmate -S /tmp/tmate.sock wait tmate-ready
          LINK=$(sudo docker exec $NAME tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "====================================="
          echo "✅ NEW EXTERNAL VPS READY!"
          echo "Connect here: $LINK"
          echo "====================================="
          EOF
          chmod +x newvps.sh

      - name: Auto-Backup Loop (Saves files every 30 mins)
        run: |
          (
            while true; do
              sleep 1800
              cd $GITHUB_WORKSPACE
              git config user.name "VPS-Auto-Saver"
              git config user.email "vps@autosaver.com"
              git add .
              git commit -m "Auto-backup at $(date)" || echo "Nothing to save."
              git push || echo "Push failed."
            done
          ) &

      - name: Keep Alive (Max 5h 50m)
        run: |
          echo "VPS is running..."
          sleep 350m
